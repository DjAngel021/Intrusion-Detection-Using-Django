<br><br><br><br>

{% if message %}
  <div id="django-alert" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span id="django-alert-message">{{ message }}</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var alertEl = document.getElementById('django-alert');
      if (!alertEl) return;
      // Show the alert (it starts hidden to avoid layout shift)
      alertEl.style.display = 'block';
      // Auto-dismiss after 5 seconds
      setTimeout(function () {
        try {
          // Use Bootstrap's Alert if available
          if (typeof bootstrap !== 'undefined' && bootstrap.Alert) {
            var bsAlert = new bootstrap.Alert(alertEl);
            bsAlert.close();
          } else {
            // Fallback: simply hide the element
            alertEl.style.transition = 'opacity 300ms ease';
            alertEl.style.opacity = '0';
            setTimeout(function () { alertEl.remove(); }, 300);
          }
        } catch (e) {
          console.error(e);
        }
      }, 5000);
    });
  </script>
{% endif %}
